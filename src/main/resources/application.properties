# Projeto local para atividade pratica da UNINTER.
spring.application.name=baozi-store-api
server.port=8080

# H2 e um banco RELACIONAL aceito no enunciado.
# Banco salvo em arquivo, mantendo os dados ao reiniciar a aplicacao.
spring.datasource.url=jdbc:h2:file:./baozi-store-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Console local para visualizacao do banco.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
